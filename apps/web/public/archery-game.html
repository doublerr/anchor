<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Longbow Range</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Oswald:wght@300;400;500;600&display=swap" />

<style>
  :root {
    --panel: rgba(28, 22, 14, 0.72);
    --panel-solid: #241c12;
    --paper: #f6efe0;
    --gold: #d9a441;
    --gold-bright: #f0c256;
    --red: #c8483c;
    --line: rgba(246, 239, 224, 0.16);
    --shadow: rgba(20, 14, 6, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--panel-solid);
    color: var(--paper);
    font-family: "Oswald", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: relative; width: 100%; height: 100vh; height: 100dvh; }

  canvas#range {
    display: block; width: 100%; height: 100%;
    cursor: none; touch-action: none;
  }

  .hud { position: absolute; pointer-events: none; z-index: 5; }

  .brand { top: clamp(14px, 3vh, 28px); left: clamp(16px, 3vw, 32px); }
  .brand h1 {
    font-family: "Cinzel", serif; font-weight: 700; margin: 0;
    font-size: clamp(20px, 3.4vw, 34px); letter-spacing: 0.06em;
    color: var(--paper); text-shadow: 0 2px 12px var(--shadow); line-height: 1;
  }
  .brand .dist {
    font-weight: 300; font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold-bright); margin-top: 6px; text-shadow: 0 1px 8px var(--shadow);
  }

  .board {
    top: clamp(14px, 3vh, 28px); right: clamp(16px, 3vw, 32px);
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px;
    display: grid; grid-template-columns: repeat(3, auto); gap: 8px 22px;
    box-shadow: 0 10px 40px var(--shadow);
  }
  .board .cell { text-align: right; }
  .board .k {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--gold-bright); font-weight: 500;
  }
  .board .v {
    font-family: "Cinzel", serif; font-weight: 600;
    font-size: clamp(20px, 3vw, 28px); line-height: 1.1; font-variant-numeric: tabular-nums;
  }

  .meter { bottom: clamp(18px, 4vh, 36px); left: clamp(16px, 3vw, 32px); width: clamp(180px, 24vw, 240px); }
  .meter .label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--paper); margin-bottom: 7px; text-shadow: 0 1px 8px var(--shadow);
  }
  .meter .label b {
    font-family: "Cinzel", serif; font-weight: 600; letter-spacing: 0.02em;
    color: var(--gold-bright); font-variant-numeric: tabular-nums;
  }
  .track {
    height: 12px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--line); overflow: hidden; box-shadow: 0 6px 24px var(--shadow);
  }
  .fill {
    height: 100%; width: 0%; border-radius: 8px;
    background: linear-gradient(90deg, #7fae5a, var(--gold), var(--red));
    transition: width 0.04s linear;
  }

  .hint {
    bottom: clamp(18px, 4vh, 36px); right: clamp(16px, 3vw, 32px);
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 4px; padding: 11px 15px;
    font-size: clamp(10px, 1.3vw, 12px); letter-spacing: 0.05em; color: var(--paper);
    box-shadow: 0 10px 40px var(--shadow); white-space: nowrap;
  }
  .hint .key {
    display: inline-block; font-family: "Oswald", sans-serif; font-weight: 600;
    color: var(--panel-solid); background: var(--gold-bright); border-radius: 3px;
    padding: 1px 7px; margin-right: 8px; letter-spacing: 0.04em; min-width: 74px; text-align: center;
  }
  .hint span { display: flex; align-items: center; }

  .controls {
    bottom: clamp(18px, 4vh, 36px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    max-width: 92vw;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px;
    box-shadow: 0 10px 40px var(--shadow); pointer-events: auto;
  }
  .cgroup { display: flex; align-items: center; gap: 10px; }
  .cdiv { width: 1px; align-self: stretch; background: var(--line); margin: 2px 0; }
  .plabel {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--gold-bright); font-weight: 500;
  }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-family: "Oswald", sans-serif; font-weight: 600; font-size: 18px; line-height: 1;
    color: var(--paper); background: transparent; border: 1px solid var(--line);
    border-radius: 3px; cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .stepper button:hover { border-color: var(--gold); }
  .stepper button:active { background: var(--gold-bright); color: var(--panel-solid); }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  .stepper .lbval {
    min-width: 46px; text-align: center; font-family: "Cinzel", serif; font-weight: 600;
    font-size: 14px; color: var(--paper); font-variant-numeric: tabular-nums;
  }
  .pbtns { display: flex; gap: 5px; }
  .pbtns button {
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.03em;
    color: var(--paper); background: transparent; border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 10px; cursor: pointer; font-variant-numeric: tabular-nums;
    transition: background .12s, color .12s, border-color .12s;
  }
  .pbtns button:hover { border-color: var(--gold); }
  .pbtns button.active { background: var(--gold-bright); color: var(--panel-solid); border-color: var(--gold-bright); }
  .pbtns button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  .toast {
    top: 42%; left: 50%; transform: translate(-50%, -50%) scale(0.6);
    font-family: "Cinzel", serif; font-weight: 700;
    font-size: clamp(48px, 11vw, 120px); color: var(--gold-bright);
    text-shadow: 0 4px 30px rgba(0,0,0,0.6); opacity: 0; letter-spacing: 0.04em; text-align: center;
  }
  .toast.pop { animation: pop 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
  .toast .sub {
    display: block; text-align: center; font-family: "Oswald", sans-serif; font-weight: 400;
    font-size: 0.22em; letter-spacing: 0.3em; text-transform: uppercase; color: var(--paper); margin-top: 0.1em;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    30%  { transform: translate(-50%,-50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-58%) scale(1); }
  }

  .endcard {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 26px 40px 30px; box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    pointer-events: auto; text-align: center;
  }
  .endcard[hidden] { display: none; }
  .ec-eyebrow {
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold-bright); font-weight: 500;
  }
  .ec-eyebrow span { font-variant-numeric: tabular-nums; }
  .ec-score {
    font-family: "Cinzel", serif; font-weight: 700; font-size: clamp(52px, 9vw, 84px);
    line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums;
  }
  .ec-sub {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--paper); opacity: 0.7; margin-bottom: 14px;
  }
  .ec-arrows { display: flex; gap: 7px; margin-bottom: 20px; }
  .ec-arrows .pip {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cinzel", serif; font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums; border: 1px solid rgba(0,0,0,0.2);
  }
  .ec-arrows .pip.miss {
    background: transparent; color: rgba(246,239,224,0.5);
    border: 1px dashed rgba(246,239,224,0.4);
  }
  .endcard button {
    font-family: "Oswald", sans-serif; font-weight: 600; font-size: 13px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--panel-solid); background: var(--gold-bright);
    border: none; border-radius: 4px; padding: 11px 26px; cursor: pointer;
    transition: transform .1s, background .12s;
  }
  .endcard button:hover { background: var(--gold); }
  .endcard button:active { transform: translateY(1px); }
  .endcard button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

  @media (max-width: 560px) { .hint { display: none; } .board { padding: 10px 12px; gap: 6px 14px; } }
  @media (prefers-reduced-motion: reduce) { .toast.pop { animation-duration: 0.01s; } .fill { transition: none; } }
</style>

<div id="stage">
  <canvas id="range"></canvas>

  <div class="hud brand">
    <h1>Longbow Range</h1>
    <div class="dist">20 metre target</div>
  </div>

  <div class="hud board">
    <div class="cell"><div class="k">End</div><div class="v" id="endnum">1</div></div>
    <div class="cell"><div class="k">Arrows</div><div class="v" id="shots">0/6</div></div>
    <div class="cell"><div class="k">Total</div><div class="v" id="total">0</div></div>
  </div>

  <div class="hud meter">
    <div class="label"><span>Draw</span> <b><span id="power">0</span>%</b></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div class="hud hint">
    <span><i class="key">MOVE</i>aim</span>
    <span><i class="key">HOLD SPACE</i>draw</span>
    <span><i class="key">RELEASE</i>loose</span>
    <span><i class="key">R</i>reset</span>
  </div>

  <div class="hud controls">
    <div class="cgroup">
      <span class="plabel">Distance</span>
      <div class="pbtns" id="pbtns"></div>
    </div>
    <div class="cdiv"></div>
    <div class="cgroup">
      <span class="plabel">Draw weight</span>
      <div class="stepper">
        <button type="button" id="lb-down" aria-label="Decrease draw weight">−</button>
        <span class="lbval" id="lb-val">20 lb</span>
        <button type="button" id="lb-up" aria-label="Increase draw weight">+</button>
      </div>
    </div>
  </div>

  <div class="hud toast" id="toast"></div>

  <div class="hud endcard" id="endcard" hidden>
    <div class="ec-eyebrow">End <span id="ec-num">1</span> complete</div>
    <div class="ec-score" id="ec-score">0</div>
    <div class="ec-sub">points this end · 6 arrows</div>
    <div class="ec-arrows" id="ec-arrows"></div>
    <button type="button" id="ec-next">Shoot next end</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("range");
  const ctx = canvas.getContext("2d");

  // ---- World (metres). Camera at origin, eye height EYE_H, looking down +z ----
  const EYE_H = 1.6;
  const START = { x: 0, y: EYE_H, z: 0.35 }; // arrow launch point
  const DISTANCES = [10, 15, 20, 30, 40, 50];
  let targetZ = 20;           // metres downrange (configurable)
  const MIN_LB = 15, MAX_LB = 60, LB_STEP = 5, REF_LB = 20;
  let poundage = 20;          // draw weight (lb); heavier = faster, flatter arrows
  const TARGET_CY = 1.30;     // centre height
  const TARGET_R = 0.45;      // face radius
  const G = 9.81;
  const DRAG = 0.010;
  const V_MIN = 23, V_MAX = 41;   // m/s across the draw
  const DRAW_TIME = 1.1;
  const LANE_HW = 2.6;        // mown-lane half width

  // ---- Layout / projection ----
  let W = 0, H = 0, dpr = 1, focal = 800, cx = 0, cy = 0;
  function layout() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    focal = W * 0.98;          // ~54deg horizontal FOV
    cx = W / 2;
    cy = H * 0.50;             // horizon at eye level (looking straight ahead)
  }
  // project world -> screen; returns null if behind camera
  function project(x, y, z) {
    if (z <= 0.06) return null;
    const s = focal / z;
    return { x: cx + x * s, y: cy - (y - EYE_H) * s, s };
  }

  // ---- State ----
  const mouse = { x: 0, y: 0 };
  let haveMouse = false;
  const aim = { x: 0, y: 0 };      // effective sight centre (mouse + breathing sway)
  let swayT = 0;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let drawing = false, power = 0;
  let arrow = null;
  const stuck = [];
  let wind = rand(-2.4, 2.4);
  const ARROWS_PER_END = 6;
  let total = 0, endNum = 1, arrowsThisEnd = 0, endScores = [], endComplete = false;
  let lastTime = performance.now();

  function rand(a, b) { return a + Math.random() * (b - a); }

  // Aim direction (unit vector) from camera through the sight centre
  function aimDir() {
    const ax = (aim.x - cx) / focal;
    const ay = (cy - aim.y) / focal;
    const len = Math.hypot(ax, ay, 1);
    return { x: ax / len, y: ay / len, z: 1 / len };
  }

  function loose() {
    const d = aimDir();
    // arrow speed scales with sqrt(draw weight); V_MAX is full-draw speed at REF_LB
    const vFull = V_MAX * Math.sqrt(poundage / REF_LB);
    const speed = vFull * (V_MIN / V_MAX + (1 - V_MIN / V_MAX) * power);
    arrow = {
      x: START.x, y: START.y, z: START.z,
      vx: d.x * speed, vy: d.y * speed, vz: d.z * speed,
      trail: [],
    };
  }

  function scoreFor(dist) {
    if (dist > TARGET_R) return 0;
    return Math.max(1, Math.min(10, Math.ceil((1 - dist / TARGET_R) * 10)));
  }

  function showToast(score) {
    const t = document.getElementById("toast");
    t.innerHTML = score > 0
      ? score + '<span class="sub">' + (score === 10 ? "Bullseye" : "points") + '</span>'
      : 'MISS<span class="sub">no score</span>';
    t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
  }

  function updateBoard() {
    document.getElementById("endnum").textContent = endNum;
    document.getElementById("shots").textContent = arrowsThisEnd + "/" + ARROWS_PER_END;
    document.getElementById("total").textContent = total;
  }

  function pipColor(s) {
    if (s >= 9) return { bg: "#e8b23a", fg: "#2b2419" };
    if (s >= 7) return { bg: "#c8483c", fg: "#f6efe0" };
    if (s >= 5) return { bg: "#4a7ba6", fg: "#f6efe0" };
    if (s >= 3) return { bg: "#2b2419", fg: "#f6efe0" };
    return { bg: "#f4efe4", fg: "#2b2419" };
  }

  function showEndCard() {
    endComplete = true;
    const endTotal = endScores.reduce((a, b) => a + b, 0);
    document.getElementById("ec-num").textContent = endNum;
    document.getElementById("ec-score").textContent = endTotal;
    const wrap = document.getElementById("ec-arrows");
    wrap.innerHTML = "";
    for (const s of endScores.slice().sort((a, b) => b - a)) { // scorecard order, high to low
      const pip = document.createElement("div");
      pip.className = "pip";
      if (s === 0) { pip.classList.add("miss"); pip.textContent = "M"; }
      else { const c = pipColor(s); pip.style.background = c.bg; pip.style.color = c.fg; pip.textContent = s; }
      wrap.appendChild(pip);
    }
    document.getElementById("endcard").hidden = false;
  }

  function newEnd() {
    endNum++;
    arrowsThisEnd = 0; endScores = []; endComplete = false;
    stuck.length = 0; arrow = null; drawing = false; power = 0;
    wind = rand(-2.4, 2.4);
    document.getElementById("endcard").hidden = true;
    updateBoard();
  }

  function land(x, y, z, onTarget) {
    stuck.push({ x, y, z, onTarget });
    if (stuck.length > 10) stuck.shift();
    const score = onTarget ? scoreFor(Math.hypot(x, y - TARGET_CY)) : 0;
    total += score;
    endScores.push(score);
    arrowsThisEnd++;
    showToast(score);
    updateBoard();
    arrow = null;
    wind = rand(-2.4, 2.4);
    if (arrowsThisEnd >= ARROWS_PER_END) showEndCard();
  }

  function stepArrow(dt) {
    if (!arrow) return;
    const SUB = 6, h = dt / SUB;
    for (let i = 0; i < SUB; i++) {
      arrow.vy -= G * h;
      arrow.vx += wind * h;
      arrow.vx *= (1 - DRAG * h); arrow.vy *= (1 - DRAG * h); arrow.vz *= (1 - DRAG * h);
      const nz = arrow.z + arrow.vz * h;
      const nx = arrow.x + arrow.vx * h;
      const ny = arrow.y + arrow.vy * h;

      if (arrow.z < targetZ && nz >= targetZ) {
        const t = (targetZ - arrow.z) / (nz - arrow.z || 1e-6);
        const xh = arrow.x + (nx - arrow.x) * t;
        const yh = arrow.y + (ny - arrow.y) * t;
        if (Math.hypot(xh, yh - TARGET_CY) <= TARGET_R + 0.02) {
          land(xh, yh, targetZ, true); return;
        }
      }
      arrow.x = nx; arrow.y = ny; arrow.z = nz;
      arrow.trail.push({ x: nx, y: ny, z: nz });
      if (arrow.trail.length > 26) arrow.trail.shift();

      if (arrow.y <= 0) { land(arrow.x, 0, arrow.z, false); return; }
      if (arrow.z > targetZ + 14) { arrow = null; return; }
    }
  }

  // ---------- Rendering ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, cy + 40);
    g.addColorStop(0, "#8fb0c6");
    g.addColorStop(0.6, "#c3cdc0");
    g.addColorStop(1, "#e7d8ac");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, cy + 40);
    const sunX = W * 0.74, sunY = cy * 0.5;
    const sg = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, cy * 1.1);
    sg.addColorStop(0, "rgba(255,246,214,0.9)");
    sg.addColorStop(1, "rgba(255,246,214,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, cy + 40);
    // treeline haze on the horizon
    ctx.fillStyle = "rgba(96,116,84,0.5)";
    ctx.beginPath(); ctx.moveTo(0, cy);
    for (let i = 0; i <= 12; i++) {
      const x = (i / 12) * W;
      ctx.lineTo(x, cy - 6 - 10 * Math.abs(Math.sin(i * 1.7)));
    }
    ctx.lineTo(W, cy); ctx.closePath(); ctx.fill();
  }

  function poly(pts, fill) {
    if (pts.some(p => !p)) return;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, cy, 0, H);
    g.addColorStop(0, "#83a457");
    g.addColorStop(1, "#3f5a2f");
    ctx.fillStyle = g; ctx.fillRect(0, cy, W, H - cy);

    const farZ = targetZ + 9;
    // mown lane stripes receding to the target
    for (let z = 1; z < farZ; z += 2) {
      const shade = ((z / 2) & 1) ? "rgba(255,255,255,0.06)" : "rgba(20,40,10,0.10)";
      poly([
        project(-LANE_HW, 0, z), project(LANE_HW, 0, z),
        project(LANE_HW, 0, z + 2), project(-LANE_HW, 0, z + 2),
      ], shade);
    }
    // lane edges
    ctx.strokeStyle = "rgba(246,239,224,0.18)"; ctx.lineWidth = 2;
    for (const side of [-LANE_HW, LANE_HW]) {
      const a = project(side, 0, 1), b = project(side, 0, farZ - 1);
      if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    // distance markers (interval scales with the chosen distance)
    const step = targetZ <= 20 ? 5 : 10;
    const marks = [];
    for (let m = step; m < targetZ; m += step) marks.push(m);
    marks.push(targetZ);
    ctx.font = "300 12px Oswald, sans-serif"; ctx.textAlign = "left";
    for (const z of marks) {
      const a = project(-LANE_HW, 0, z), b = project(LANE_HW, 0, z);
      if (!a || !b) continue;
      const key = z === targetZ;
      ctx.strokeStyle = key ? "rgba(240,194,86,0.7)" : "rgba(246,239,224,0.22)";
      ctx.lineWidth = key ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = key ? "rgba(240,194,86,0.95)" : "rgba(246,239,224,0.5)";
      ctx.fillText(z + " m", b.x + 6, b.y + 4);
    }
  }

  function drawTarget() {
    const c = project(0, TARGET_CY, targetZ);
    const foot = project(0, 0, targetZ);
    if (!c) return;
    const R = TARGET_R * c.s;
    // stand + shadow
    if (foot) {
      ctx.strokeStyle = "#5a4327"; ctx.lineWidth = Math.max(2, R * 0.12);
      ctx.beginPath();
      ctx.moveTo(c.x - R * 0.5, c.y + R * 0.7); ctx.lineTo(foot.x - R * 0.6, foot.y);
      ctx.moveTo(c.x + R * 0.5, c.y + R * 0.7); ctx.lineTo(foot.x + R * 0.6, foot.y);
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(foot.x, foot.y, R * 1.05, R * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20,14,6,0.22)"; ctx.fill();
    }
    // rings: white, black, blue, red, gold (outer -> inner)
    const rings = [
      [1.00, "#f4efe4"], [0.90, "#f4efe4"], [0.80, "#2b2419"], [0.70, "#2b2419"],
      [0.60, "#4a7ba6"], [0.50, "#4a7ba6"], [0.40, "#c8483c"], [0.30, "#c8483c"],
      [0.20, "#e8b23a"], [0.10, "#e8b23a"],
    ];
    ctx.save();
    ctx.shadowColor = "rgba(20,14,6,0.3)"; ctx.shadowBlur = R * 0.5; ctx.shadowOffsetY = R * 0.14;
    for (const [rr, col] of rings) {
      ctx.beginPath(); ctx.arc(c.x, c.y, R * rr, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill(); ctx.shadowColor = "transparent";
      ctx.lineWidth = Math.max(0.5, R * 0.02); ctx.strokeStyle = "rgba(43,36,25,0.3)"; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(1, R * 0.05), 0, Math.PI * 2);
    ctx.fillStyle = "#7a4a12"; ctx.fill();
    ctx.restore();
  }

  function drawStuck() {
    for (const a of stuck) {
      const p = project(a.x, a.y, a.z);
      if (!p) continue;
      const len = Math.max(4, 0.5 * p.s);
      ctx.save(); ctx.translate(p.x, p.y);
      // seen almost head-on: a short shaft going away + fletch nearest us
      ctx.strokeStyle = a.onTarget ? "#efe6cf" : "#cdbf9f";
      ctx.lineWidth = Math.max(1.2, p.s * 0.02);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-len * 0.25, len * 0.5); ctx.stroke();
      ctx.fillStyle = "#c8483c";
      ctx.beginPath(); ctx.arc(-len * 0.25, len * 0.5, Math.max(1.2, p.s * 0.03), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawFlying() {
    if (!arrow) return;
    // trail
    ctx.strokeStyle = "rgba(246,239,224,0.4)"; ctx.lineWidth = 2;
    ctx.beginPath(); let started = false;
    for (const p of arrow.trail) {
      const s = project(p.x, p.y, p.z); if (!s) continue;
      started ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); started = true;
    }
    ctx.stroke();
    // arrow: from a point just behind the tip to the tip
    const tip = project(arrow.x, arrow.y, arrow.z);
    const back = project(arrow.x - arrow.vx * 0.03, arrow.y - arrow.vy * 0.03, arrow.z - arrow.vz * 0.03);
    if (tip && back) {
      ctx.strokeStyle = "#2f2718"; ctx.lineWidth = Math.max(1.5, tip.s * 0.03);
      ctx.beginPath(); ctx.moveTo(back.x, back.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
      ctx.fillStyle = "#c8483c";
      ctx.beginPath(); ctx.arc(back.x, back.y, Math.max(1.5, tip.s * 0.035), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Bow sight: a pin-in-ring aperture held close to the eye, so it reads
  // slightly out of focus while the downrange target stays sharp.
  function drawSight() {
    const x = aim.x, y = aim.y;
    const R = Math.max(30, H * 0.06);   // aperture radius
    ctx.save();
    ctx.filter = "blur(1.6px)";         // shallow depth of field (ignored if unsupported)

    // sight arm reaching in from the bottom of view toward the ring
    ctx.strokeStyle = "rgba(26,22,16,0.55)"; ctx.lineWidth = Math.max(5, W * 0.008); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y + R); ctx.lineTo(x + (cx - x) * 0.1, H + 20); ctx.stroke();

    // aperture housing (dark metal ring) with a faint inner highlight
    ctx.strokeStyle = "rgba(24,20,14,0.9)"; ctx.lineWidth = Math.max(5, R * 0.16);
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(220,210,190,0.45)"; ctx.lineWidth = Math.max(1, R * 0.04);
    ctx.beginPath(); ctx.arc(x, y, R * 0.86, 0, Math.PI * 2); ctx.stroke();

    // thin sight cross inside the aperture, leaving a gap around the pin
    const gap = R * 0.22;
    ctx.strokeStyle = "rgba(30,26,18,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - R * 0.82, y); ctx.lineTo(x - gap, y);
    ctx.moveTo(x + gap, y); ctx.lineTo(x + R * 0.82, y);
    ctx.moveTo(x, y - R * 0.82); ctx.lineTo(x, y - gap);
    ctx.moveTo(x, y + gap); ctx.lineTo(x, y + R * 0.82);
    ctx.stroke();

    // glowing fiber-optic aiming pin at the centre
    ctx.shadowColor = "rgba(120,240,120,0.95)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#8dff7a";
    ctx.beginPath(); ctx.arc(x, y, Math.max(2.6, R * 0.09), 0, Math.PI * 2); ctx.fill();

    // the bowstring, inches from the eye and heavily out of focus: a soft
    // vertical streak of light just to the right of the aperture
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
    ctx.filter = "blur(5px)";
    const strX = x + R * 1.35;
    ctx.lineCap = "butt";
    ctx.strokeStyle = "rgba(246,239,224,0.45)"; ctx.lineWidth = Math.max(3.5, R * 0.11);
    ctx.beginPath(); ctx.moveTo(strX, 0); ctx.lineTo(strX, H); ctx.stroke();
    // brighter core highlight where light catches the string
    ctx.strokeStyle = "rgba(255,251,236,0.7)"; ctx.lineWidth = Math.max(1.2, R * 0.03);
    ctx.beginPath(); ctx.moveTo(strX - R * 0.04, 0); ctx.lineTo(strX - R * 0.04, H); ctx.stroke();

    ctx.filter = "none";
    ctx.restore();
  }

  function drawWind() {
    const dir = wind >= 0 ? 1 : -1;
    const mag = Math.min(1, Math.abs(wind) / 2.4);
    const bx = cx, by = H * 0.14;
    ctx.save();
    ctx.textAlign = "center"; ctx.fillStyle = "rgba(246,239,224,0.85)";
    ctx.font = "500 11px Oswald, sans-serif";
    ctx.fillText("WIND", bx, by - 10);
    ctx.globalAlpha = 0.5 + mag * 0.5;
    ctx.strokeStyle = "rgba(246,239,224,0.9)"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    const L = 16 + mag * 34;
    ctx.beginPath(); ctx.moveTo(bx - dir * L / 2, by); ctx.lineTo(bx + dir * L / 2, by); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + dir * L / 2, by); ctx.lineTo(bx + dir * (L / 2 - 8), by - 5);
    ctx.moveTo(bx + dir * L / 2, by); ctx.lineTo(bx + dir * (L / 2 - 8), by + 5);
    ctx.stroke();
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.04, (now - lastTime) / 1000);
    lastTime = now;

    if (drawing && power < 1) power = Math.min(1, power + dt / DRAW_TIME);
    stepArrow(dt);

    // effective aim = mouse + breathing sway that steadies as the draw fills
    swayT += dt;
    const baseX = haveMouse ? mouse.x : cx;
    const baseY = haveMouse ? mouse.y : cy - H * 0.10;
    const amp = reduceMotion ? 0 : (1 - power) * 4.5;
    aim.x = baseX + (Math.sin(swayT * 1.3) + 0.5 * Math.sin(swayT * 0.7 + 1)) * amp;
    aim.y = baseY + (Math.cos(swayT * 1.1) + 0.5 * Math.cos(swayT * 0.9 + 2)) * amp * 0.85;

    const pct = Math.round(power * 100);
    document.getElementById("power").textContent = pct;
    document.getElementById("fill").style.width = pct + "%";

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawGround();
    drawTarget();
    drawStuck();
    drawFlying();
    drawWind();
    drawSight();

    requestAnimationFrame(frame);
  }

  // ---- Input ----
  function pointer(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; haveMouse = true;
  }
  canvas.addEventListener("mousemove", pointer);
  canvas.addEventListener("touchmove", (e) => { pointer(e); e.preventDefault(); }, { passive: false });

  function startDraw() {
    if (endComplete) { newEnd(); return; }   // first press after an end starts the next one
    if (arrow || drawing) return;
    drawing = true; power = 0;
  }
  function release() { if (!drawing) return; drawing = false; loose(); power = 0; }

  document.getElementById("ec-next").addEventListener("click", newEnd);

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); startDraw(); }
    else if (e.key === "n" || e.key === "N") { if (endComplete) newEnd(); }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "[") adjustPoundage(-LB_STEP);
    else if (e.key === "]") adjustPoundage(LB_STEP);
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") { e.preventDefault(); release(); } });

  canvas.addEventListener("mousedown", (e) => { pointer(e); startDraw(); });
  canvas.addEventListener("mouseup", release);
  canvas.addEventListener("touchstart", (e) => { pointer(e); startDraw(); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchend", (e) => { release(); e.preventDefault(); }, { passive: false });

  function reset() {
    total = 0; endNum = 1; arrowsThisEnd = 0; endScores = []; endComplete = false;
    stuck.length = 0; arrow = null; drawing = false; power = 0;
    document.getElementById("endcard").hidden = true;
    updateBoard();
  }

  // ---- Distance picker ----
  const distLabel = document.querySelector(".brand .dist");
  const pbtns = document.getElementById("pbtns");
  const btnEls = {};
  function setDistance(z) {
    targetZ = z;
    arrow = null; drawing = false; power = 0;
    stuck.length = 0;
    arrowsThisEnd = 0; endScores = []; endComplete = false; // restart the end at the new distance
    document.getElementById("endcard").hidden = true;
    wind = rand(-2.4, 2.4);
    distLabel.textContent = z + " metre target";
    for (const d in btnEls) btnEls[d].classList.toggle("active", Number(d) === z);
    updateBoard();
  }
  for (const d of DISTANCES) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = d + "m";
    b.setAttribute("aria-label", "Set target distance to " + d + " metres");
    b.addEventListener("click", () => { setDistance(d); b.blur(); });
    btnEls[d] = b;
    pbtns.appendChild(b);
  }
  setDistance(targetZ);

  // ---- Draw-weight (poundage) control ----
  const lbVal = document.getElementById("lb-val");
  const lbDown = document.getElementById("lb-down");
  const lbUp = document.getElementById("lb-up");
  function updatePoundage() {
    lbVal.textContent = poundage + " lb";
    lbDown.disabled = poundage <= MIN_LB;
    lbUp.disabled = poundage >= MAX_LB;
  }
  function adjustPoundage(delta) {
    poundage = Math.min(MAX_LB, Math.max(MIN_LB, poundage + delta));
    updatePoundage();
  }
  lbDown.addEventListener("click", () => { adjustPoundage(-LB_STEP); lbDown.blur(); });
  lbUp.addEventListener("click", () => { adjustPoundage(LB_STEP); lbUp.blur(); });
  updatePoundage();

  window.addEventListener("resize", layout);
  layout();
  requestAnimationFrame(frame);
})();
</script>

</html>
